name: check

on:
  push:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check (unit tests, headless QML and runtime)
        run: nix flake check --print-build-logs
